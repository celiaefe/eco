services:
  - type: web
    name: eco
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: eco-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        value: "https://eco-five-phi.vercel.app"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: PREMIUM_ENABLED
        value: "false"
      - key: AUTH_ENABLED
        value: "false"
      - key: AUTH_BYPASS_EMAIL
        value: "celiafm17@gmail.com"

databases:
  - name: eco-db
    plan: free
    region: frankfurt
